name: Build OmniRoute Bun Latest

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Chỉ kiểm tra cấu hình phần cứng Runner (Không chạy build)'
        required: false
        default: false
        type: boolean
      branch_or_tag:
        description: 'Nhánh hoặc Tag cụ thể (Để trống = tự lấy nhánh mặc định mới nhất của tác giả)'
        required: false
        default: ''
      target_stage:
        description: 'Chọn bản build (runner-base: nhẹ ~250MB | runner-web: có sẵn Chromium)'
        required: false
        default: 'runner-base'
        type: choice
        options:
          - runner-base
          - runner-web

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Kiểm tra cấu hình phần cứng Runner (CPU, RAM, Disk)
        run: |
          echo "================ THÔNG TIN CPU ================"
          lscpu | grep -E "Model name|Socket|Thread|NUMA|CPU\(s\):" || true
          echo "Tổng số luồng CPU khả dụng: $(nproc)"
          
          echo ""
          echo "================ THÔNG TIN RAM & SWAP ========="
          free -h
          
          echo ""
          echo "================ DUNG LƯỢNG Ổ CỨNG ============"
          df -h /

      - name: 2. Kéo code mới nhất từ repo gốc diegosouzapw/OmniRoute
        if: ${{ !inputs.check_only }}
        uses: actions/checkout@v4
        with:
          repository: diegosouzapw/OmniRoute
          ref: ${{ inputs.branch_or_tag }}

      - name: 3. Kiểm tra thông tin phiên bản OmniRoute vừa kéo về
        if: ${{ !inputs.check_only }}
        run: |
          echo "Đang build từ nhánh/commit: $(git log -1 --format='%h - %s (%ci)')"
          echo "Phiên bản trong package.json: $(jq -r .version package.json)"

      - name: 4. Tự động tính toán và bơm cấu hình tối ưu vào Dockerfile.bun
        if: ${{ !inputs.check_only }}
        run: |
          # Đọc tổng RAM thực tế của Runner (tính bằng MB)
          TOTAL_RAM_MB=$(free -m | awk '/^Mem:/{print $2}')
          # Dành lại khoảng 2.5GB (2560MB) cho OS, Docker daemon và tiến trình chính của Bun
          MAX_OLD_SPACE=$((TOTAL_RAM_MB - 2560))
          if [ "$MAX_OLD_SPACE" -lt 4096 ]; then MAX_OLD_SPACE=4096; fi
          
          CPU_CORES=$(nproc)
          echo "-> Phát hiện Runner có ${CPU_CORES} cores và ${TOTAL_RAM_MB}MB RAM."
          echo "-> Sẽ cấu hình CIRCLE_NODE_TOTAL=${CPU_CORES} và NODE_OPTIONS=--max-old-space-size=${MAX_OLD_SPACE}"

          # Chèn cấu hình động vào ngay trước dòng lệnh build trong Dockerfile.bun
          sed -i "s/RUN bun run --quiet build/ENV CIRCLE_NODE_TOTAL=${CPU_CORES} NODE_OPTIONS=\"--max-old-space-size=${MAX_OLD_SPACE}\"\nRUN bun --smol run --quiet build/" Dockerfile.bun
          
          echo "--- Đoạn Dockerfile.bun sau khi được tối ưu ---"
          grep -C 3 "bun --smol run" Dockerfile.bun

      - name: 5. Đăng nhập GitHub Container Registry (GHCR)
        if: ${{ !inputs.check_only }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 6. Cài đặt Docker Buildx
        if: ${{ !inputs.check_only }}
        uses: docker/setup-buildx-action@v3

      - name: 7. Build và đẩy Image lên GHCR của bạn
        if: ${{ !inputs.check_only }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.bun
          target: ${{ inputs.target_stage }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/omniroute-bun:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
