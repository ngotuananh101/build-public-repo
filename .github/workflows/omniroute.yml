name: Build OmniRoute Bun Latest

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Chỉ kiểm tra cấu hình phần cứng Runner (Không chạy build)'
        required: false
        default: false
        type: boolean
      branch_or_tag:
        description: 'Nhánh hoặc Tag cụ thể (Để trống = tự lấy nhánh mặc định mới nhất của tác giả)'
        required: false
        default: ''
      target_stage:
        description: 'Chọn bản build (runner-base: nhẹ ~250MB | runner-web: có sẵn Chromium)'
        required: false
        default: 'runner-base'
        type: choice
        options:
          - runner-base
          - runner-web
      use_turbopack:
        description: 'Bật Turbopack (Nên để 0 - dùng Webpack để tiết kiệm RAM và tránh lỗi OOM)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Kiểm tra cấu hình phần cứng Runner (CPU, RAM, Disk)
        run: |
          echo "================ THÔNG TIN CPU ================"
          lscpu | grep -E "Model name|Socket|Thread|NUMA|CPU\(s\):" || true
          echo "Tổng số luồng CPU khả dụng: $(nproc)"
          echo ""
          echo "================ THÔNG TIN RAM & SWAP ========="
          free -h
          echo ""
          echo "================ DUNG LƯỢNG Ổ CỨNG ============"
          df -h /

      - name: 2. Bơm thêm 12GB Swap từ ổ cứng trống (Nâng tổng bộ nhớ lên ~30GB)
        if: ${{ !inputs.check_only }}
        run: |
          sudo fallocate -l 12G /swapfile_extra
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          echo "--- Bộ nhớ sau khi nâng cấp Swap ---"
          free -h

      - name: 3. Kéo code mới nhất từ repo gốc diegosouzapw/OmniRoute
        if: ${{ !inputs.check_only }}
        uses: actions/checkout@v4
        with:
          repository: diegosouzapw/OmniRoute
          ref: ${{ inputs.branch_or_tag }}

      - name: 4. Kiểm tra thông tin phiên bản OmniRoute vừa kéo về
        if: ${{ !inputs.check_only }}
        run: |
          echo "Đang build từ nhánh/commit: $(git log -1 --format='%h - %s (%ci)')"
          echo "Phiên bản trong package.json: $(jq -r .version package.json)"

      - name: 5. Tối ưu chống tràn RAM (OOM) trong Dockerfile.bun
        if: ${{ !inputs.check_only }}
        run: |
          # Đặt CIRCLE_NODE_TOTAL=2 (chỉ chạy tối đa 2 worker song song)
          # Giới hạn mỗi worker Node tối đa 4096MB (4GB) thay vì 6GB+ để không nhân bản tràn RAM
          # Giới hạn tiến trình chính của Bun (JSC) ở mức 6GB
          sed -i 's/RUN bun run --quiet build/ENV CIRCLE_NODE_TOTAL=2 NODE_OPTIONS="--max-old-space-size=4096" BUN_JSC_forceRAMSize=6442450944\nRUN bun --smol run --quiet build/' Dockerfile.bun
          
          # Giới hạn luồng lúc bun install để tránh spike RAM
          sed -i 's/RUN bun install --include=optional --quiet/RUN bun install --include=optional --network-concurrency 8/' Dockerfile.bun

          echo "--- Kiểm tra Dockerfile.bun sau khi vá chống OOM ---"
          grep -C 3 "bun --smol run" Dockerfile.bun

      - name: 6. Đăng nhập GitHub Container Registry (GHCR)
        if: ${{ !inputs.check_only }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 7. Cài đặt Docker Buildx (Dùng driver docker trực tiếp để nhận diện đủ 30GB RAM+Swap)
        if: ${{ !inputs.check_only }}
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: 8. Build và đẩy Image lên GHCR của bạn
        if: ${{ !inputs.check_only }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.bun
          target: ${{ inputs.target_stage }}
          platforms: linux/amd64
          push: true
          build-args: |
            OMNIROUTE_USE_TURBOPACK=${{ inputs.use_turbopack }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/omniroute-bun:latest
          # Lưu ý: với driver: docker, không dùng cache-to gha để tránh tốn thêm RAM đóng gói cache lúc cuối
