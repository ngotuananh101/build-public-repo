name: Build OmniRoute Bun Latest (Native Fast Multi-Arch)

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Chỉ kiểm tra cấu hình phần cứng Runner (Không chạy build)'
        required: false
        default: false
        type: boolean
      branch_or_tag:
        description: 'Nhánh hoặc Tag cụ thể (Để trống = tự lấy nhánh mặc định mới nhất của tác giả)'
        required: false
        default: ''
      target_stage:
        description: 'Chọn bản build (runner-base: nhẹ ~250MB | runner-web: có sẵn Chromium)'
        required: false
        default: 'runner-base'
        type: choice
        options:
          - runner-base
          - runner-web
      use_turbopack:
        description: 'Bật Turbopack (Nên để 0 - Webpack nhanh gấp đôi và không bị quét nhầm 16.000 file)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

permissions:
  contents: read
  packages: write

jobs:
  # ── JOB 1: Chạy song song trên 2 máy chủ vật lý độc lập (1 máy x64 + 1 máy ARM64 thật) ──
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch_tag: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch_tag: arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - name: 1. Kiểm tra cấu hình phần cứng Runner (${{ matrix.arch_tag }})
        run: |
          echo "================ KIẾN TRÚC MÁY: $(uname -m) ================"
          lscpu | grep -E "Model name|Architecture|CPU\(s\):" || true
          echo ""
          echo "================ THÔNG TIN RAM & SWAP ========="
          free -h
          echo ""
          echo "================ DUNG LƯỢNG Ổ CỨNG ============"
          df -h /

      - name: 2. Bơm thêm 12GB Swap chống OOM tuyệt đối
        if: ${{ !inputs.check_only }}
        run: |
          sudo fallocate -l 12G /swapfile_extra
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: 3. Kéo code mới nhất từ repo gốc diegosouzapw/OmniRoute
        if: ${{ !inputs.check_only }}
        uses: actions/checkout@v4
        with:
          repository: diegosouzapw/OmniRoute
          ref: ${{ inputs.branch_or_tag }}

      - name: 4. Tối ưu RAM và vá lỗi gói apt trong Dockerfile.bun
        if: ${{ !inputs.check_only }}
        run: |
          echo "Đang build từ commit: $(git log -1 --format='%h - %s (%ci)')"
          
          # 1. Khóa số worker và RAM để chạy mượt trên từng máy
          sed -i 's/RUN bun run --quiet build/ENV CIRCLE_NODE_TOTAL=2 NODE_OPTIONS="--max-old-space-size=6144" BUN_JSC_forceRAMSize=6442450944\nRUN bun --smol run --quiet build/' Dockerfile.bun
          
          # 2. Giảm tải mạng lúc bun install
          sed -i 's/RUN bun install --include=optional --quiet/RUN bun install --include=optional --network-concurrency 8/' Dockerfile.bun

          # 3. Vá lỗi các gói apt đã bị khai tử trên Debian Trixie (nếu bạn chọn runner-web)
          sed -i '/gconf-service/d' Dockerfile.bun
          sed -i '/stdc++6/d' Dockerfile.bun
          sed -i '/fonts-kacst/d' Dockerfile.bun

      - name: 5. Đăng nhập GitHub Container Registry (GHCR)
        if: ${{ !inputs.check_only }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 6. Cài đặt Docker Buildx (Dùng driver docker trực tiếp - 100% hiệu năng gốc)
        if: ${{ !inputs.check_only }}
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: 7. Build Native và Push nhánh ${{ matrix.arch_tag }}
        if: ${{ !inputs.check_only }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.bun
          target: ${{ inputs.target_stage }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            OMNIROUTE_USE_TURBOPACK=${{ inputs.use_turbopack }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/omniroute-bun:latest-${{ matrix.arch_tag }}

  # ── JOB 2: Gộp 2 bản build (amd64 + arm64) thành 1 tag :latest duy nhất (Chỉ mất 5 giây) ──
  merge-manifest:
    needs: build-native
    if: ${{ !inputs.check_only && success() }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Gộp Manifest đa kiến trúc (linux/amd64 + linux/arm64)
        run: |
          IMAGE_BASE="ghcr.io/${{ github.repository_owner }}/omniroute-bun"
          docker buildx imagetools create \
            -t "${IMAGE_BASE}:latest" \
            "${IMAGE_BASE}:latest-amd64" \
            "${IMAGE_BASE}:latest-arm64"
          
          echo "=== Kiểm tra Manifest sau khi gộp ==="
          docker buildx imagetools inspect "${IMAGE_BASE}:latest"
